<!doctype html>
<html lang="en">
  <head>
    <title>Playas</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="mycss.css">
  </head>
  <body>
    <div class="container p-0 shadow">

        <div class="div">
          <button data-toggle="modal" data-target="#modalRatings">PULSAME PERRO</button>
        </div>


        <div class="modal fade" id="modalRatings" tabindex="-1" role="dialog">
          <div class="modal-dialog" role="document">
              <div class="modal-content">
                  <div class="modal-header">
                      <h3 class="modal-title text-center">Calificación de la playa</h3>
                      
                      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                          <span aria-hidden="true">&times;</span>
                      </button>
                  </div>
                  <div class="modal-body">
                      <h4 class="text-center">Nombre Playa</h4>
                      <div id="resumen">
                        <table class="table table-striped my-3">
                              <tr>
                                  <td class="text-right col-6 pr-5"><img src="img/ic_1.png" alt="" width="50px"></td>
                                  <td class="text-left col-6 pl-5 pt-4">5</td>
                              </tr>
                              <tr>
                                  <td class="text-right col-6 pr-5"><img src="img/ic_2.png" alt="" width="50px"></td>
                                  <td class="text-left col-6 pl-5 pt-4">3</td>
                              </tr>
                              <tr>
                                  <td class="text-right col-6 pr-5"><img src="img/ic_3.png" alt="" width="50px"></td>
                                  <td class="text-left col-6 pl-5 pt-4">7</td>
                              </tr>
                              <tr>
                                  <td class="text-right col-6 pr-5"><img src="img/ic_4.png" alt="" width="50px"></td>
                                  <td class="text-left col-6 pl-5 pt-4">1</td>
                              </tr>
                              <tr>
                                  <td class="text-right col-6 pr-5"><img src="img/ic_5.png" alt="" width="50px"></td>
                                  <td class="text-left col-6 pl-5 pt-4">0</td>
                              </tr>
                      </table>
                      </div>

                      <div class="modal-footer">
                          <button type="button" class="btn btn-success" data-dismiss="modal">
                              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-check-lg mr-1 mb-1" viewBox="0 0 16 16">
                              <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425a.247.247 0 0 1 .02-.022Z"/>
                              </svg>Aceptar
                          </button>
                      </div>
                  </div>
              </div>
          </div>
      </div>


        <footer>
            <h3 class="bg-primary text-white text-center py-3 mb-0">Playas &copy; Iván Gómez</h3>
        </footer>
    </div>
      
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
